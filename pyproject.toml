[project]
name = "family-care-affordability"
version = "0.1.0"
description = "区间收入调查下的照护可负担性与资助覆盖测算的业务数据服务"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "scipy==1.15.3"]

[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["affordability"]

[tool.unittest]
start-directory = "tests"
